name: daily-review
on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC = 10:00 Beijing
  workflow_dispatch:
    inputs:
      reclassify_dates:
        description: "Optional 收录日 (ingest dates, YYYY-MM-DD) to reclassify, separated by spaces — NOT the 归档日 shown at /day/<date>.html"
        required: false
        type: string
      fetch_window_days:
        description: "Optional: how many days back to fetch, overriding the default window. Use to recover papers that fell out of the rolling window during an outage."
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-review
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Code tests only. The `livedata` checks assert properties of the stored
      # data, which no code change can fix; letting one publisher's odd date
      # block this step would silently stop the site updating until a human
      # noticed. They run after the pipeline instead, advisory.
      - run: pytest -q -m "not livedata"
      - name: Reclassify stored days
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reclassify_dates != '' }}
        env:
          HEPAI_API_KEY: ${{ secrets.HEPAI_API_KEY }}
          GDR_RECLASSIFY_DATES: ${{ inputs.reclassify_dates }}
        run: python scripts/reclassify_days.py $GDR_RECLASSIFY_DATES
      - name: Run daily pipeline
        id: pipeline
        env:
          HEPAI_API_KEY: ${{ secrets.HEPAI_API_KEY }}
          ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}
          GDR_FETCH_WINDOW_DAYS: ${{ inputs.fetch_window_days }}
        run: |
          # A scheduled run leaves the input empty; an empty env var would be a
          # parse error, so drop it and let config keep its own default.
          [ -n "$GDR_FETCH_WINDOW_DAYS" ] || unset GDR_FETCH_WINDOW_DAYS
          python scripts/run_daily.py
      - name: Check stored data (advisory)
        if: ${{ !cancelled() && steps.pipeline.conclusion != 'skipped' }}
        continue-on-error: true
        run: pytest -q -m livedata
      - name: Commit data
        # A partial outage still stored real papers; they must reach the repo.
        if: ${{ !cancelled() && steps.pipeline.conclusion != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: daily update $(date -u +%F)" || echo "no changes"
          # A site/deployment change may land while the long model pass runs.
          # Rebase the generated data commit instead of discarding the result.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
      - uses: actions/upload-pages-artifact@v5
        id: upload
        # A partial outage still renders a site, so it is published. A failure
        # early enough that build_site never ran leaves no site/ at all (it is
        # gitignored, so the checkout has none either) -- skip rather than add a
        # second red step that hides the real one.
        if: ${{ !cancelled() && hashFiles('site/index.html') != '' }}
        with:
          path: site
  deploy:
    needs: build
    # A red build that still produced a site artifact (a partial outage) must
    # deploy what survived; a build that never got that far must not.
    if: ${{ !cancelled() && needs.build.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
